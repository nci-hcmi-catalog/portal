name: hcmi
services:
  hcmi-api:
    build:
      context: .
      target: hcmi-api
    container_name: hcmi-api
    depends_on:
      opensearch:
        condition: service_healthy
    image: hcmi-api
    ports:
      - 5050:5050

  hcmi-cms:
    build:
      context: .
      target: hcmi-cms
    container_name: hcmi-cms
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      - MONGO_URL=mongodb://mongo:27017
    image: hcmi-cms
    ports:
      - 8080:8080

  hcmi-ui:
    build:
      context: .
      target: hcmi-ui
    container_name: hcmi-ui
    depends_on:
      - hcmi-api
      - hcmi-cms
    environment:
      - REACT_APP_ARRANGER_API=http://localhost:5050
      - REACT_APP_BANNERS=[{"type":"INFO","dismissible":false,"title":"HCMI Portal Maintenance Notice","message":"Please note that the portal will be down for maintenance from December 21st 2024 at 3:00am to December 23rd 2024 at 10:00am. We apologize for the inconvenience."}]
      - REACT_APP_CMS_API_URL=http://localhost:8080/api/v1
      - REACT_APP_ENABLE_PROTEOMICS=true
      - REACT_APP_GA4_TAG=
      - REACT_APP_GOOGLE_CLIENT_ID=
      - REACT_APP_LOGOUT_URL=
      - REACT_APP_VERSION=hcmi
    image: hcmi-ui
    ports:
      - 3000:3000

  mongo:
    container_name: hcmi-mongodb
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    image: mongo:8.0.4
    ports:
      - 27017:27017
    restart: always
    volumes:
      - ./docker/mongo/data:/data/db

  opensearch:
    container_name: hcmi-opensearch
    environment:
      - discovery.type=single-node
      - cluster.name=hcmi.opensearch
      - cluster.routing.allocation.disk.threshold_enabled=false
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx2048m
      - DISABLE_SECURITY_PLUGIN=true
    # Prevents API startup before container is ready for connections
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "curl -s -k http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    image: 'opensearchproject/opensearch:latest'
    ports:
      - 9200:9200
      - 9300:9300
    volumes:
      - ./docker/opensearch/data:/usr/share/opensearch/data
